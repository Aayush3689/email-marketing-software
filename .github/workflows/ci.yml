name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  typescript:
    name: TypeScript Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test

  rust:
    name: Rust Format, Clippy & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  migrations:
    name: PostgreSQL Schema Migration Smoke Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mailplat
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: mailplat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply SQL migrations twice (idempotency check)
        env:
          DATABASE_URL: postgresql://mailplat:ci_password@localhost:5432/mailplat
        run: |
          chmod +x scripts/migrate.sh
          ./scripts/migrate.sh
          ./scripts/migrate.sh

  docker-build:
    name: Docker Image Smoke Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Node backend image
        run: docker build -f infrastructure/docker/Dockerfile.node -t mailplat-node:ci .
      - name: Build Frontend Web console image
        run: docker build -f infrastructure/docker/Dockerfile.frontend --build-arg WORKSPACE=@mail/web --build-arg APP_DIR=apps/web -t mailplat-web:ci .
      - name: Build Dovecot IMAP/LMTP image
        run: docker build -f infrastructure/dovecot/Dockerfile -t mailplat-dovecot:ci infrastructure/dovecot
      - name: Build Rust mail-engine image
        run: docker build -f infrastructure/docker/Dockerfile.mail-engine -t mailplat-mta:ci .

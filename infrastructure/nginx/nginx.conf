worker_processes auto;

events {
    worker_connections 2048;
}

http {
    sendfile on;
    tcp_nopush on;
    server_tokens off;
    client_max_body_size 25m;

    # Unified reverse proxy (TLS on 443 when certs exist via entrypoint; 80 redirects/serves health)
    server {
        listen 80 default_server;
        listen 443 ssl http2 default_server;

        ssl_certificate /etc/letsencrypt/live/fastconnect.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fastconnect.in/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location = /healthz {
            proxy_pass http://api:4000/healthz;
            proxy_set_header Host $host;
        }

        location = /readyz {
            proxy_pass http://api:4000/readyz;
            proxy_set_header Host $host;
        }

        location /v1/ {
            proxy_pass http://api:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/v1/ {
            proxy_pass http://api:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /mail/v1/events {
            proxy_pass http://mailbox-service:4100/mail/v1/events;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        location /mail/v1/ {
            proxy_pass http://mailbox-service:4100;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://web:80;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 443 ssl http2;
        server_name mail.* webmail.*;

        ssl_certificate /etc/letsencrypt/live/fastconnect.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fastconnect.in/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = /mail/v1/events {
            proxy_pass http://mailbox-service:4100/mail/v1/events;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        location /mail/v1/ {
            proxy_pass http://mailbox-service:4100;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://mail:80;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 443 ssl http2;
        server_name admin.* ops.*;

        ssl_certificate /etc/letsencrypt/live/fastconnect.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fastconnect.in/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location /v1/ {
            proxy_pass http://api:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/v1/ {
            proxy_pass http://api:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://admin:80;
            proxy_set_header Host $host;
        }
    }
}

groups:
  - name: mail_infrastructure_alerts
    rules:
      - alert: MtaNodeDown
        expr: up{job="mail-engine"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Rust MTA node unreachable ({{ $labels.instance }})"

      - alert: TransactionalQueueWaitHigh
        expr: histogram_quantile(0.99, sum(rate(mta_delivery_stage_duration_seconds_bucket{stage="queue_wait",pool="transactional"}[5m])) by (le)) > 2.0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Transactional queue_wait p99 exceeded 2 seconds"

      - alert: ElevatedOutboundBounceRate
        expr: sum(rate(mta_delivery_attempts_total{outcome="bounced"}[10m])) / clamp_min(sum(rate(mta_delivery_attempts_total[10m])), 1) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbound hard bounce ratio exceeded 5% over 10m window"

      - alert: AdaptiveThrottleSpike
        expr: sum(rate(mta_adaptive_throttles_total[5m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High provider 421/429 adaptive throttling rate on {{ $labels.provider }}"

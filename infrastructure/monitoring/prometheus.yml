global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: mail-engine
    static_configs:
      - targets:
          - mail-engine:9100

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:4000

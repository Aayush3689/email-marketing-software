[workspace]
resolver = "2"
members = [
    "services/mail-engine",
    "crates/observability",
    "crates/smtp-protocol",
    "crates/smtp-server",
    "crates/smtp-session",
    "crates/smtp-inbound",
    "crates/smtp-outbound",
    "crates/delivery-engine",
    "crates/dns-resolver",
    "crates/dkim",
    "crates/auth-verification",
    "crates/mime-parser",
    "crates/queue-engine",
    "crates/mailbox-client",
    "crates/message-storage",
    "crates/rate-limiter",
    "crates/bounce-handler",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1.42", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
uuid = { version = "1.11", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "ipnetwork"] }
lapin = "2.5"
tokio-executor-trait = "2.1"
tokio-reactor-trait = "1.1"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
hickory-resolver = "0.24"
mail-parser = "0.9"
mail-builder = "0.3"
mail-auth = { version = "0.4", features = ["generate", "ring", "rustls-pemfile"] }
prometheus = "0.13"
bytes = "1.9"
argon2 = "0.5"
aes-gcm = "0.10"
base64 = "0.22"
futures-lite = "2.5"
hex = "0.4"
libc = "0.2"
rand = "0.8"
rcgen = "0.13"
rustls-pemfile = "2.2"
sha2 = "0.10"
webpki-roots = "0.26"
zeroize = { version = "1.8", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.lints.cargo]
unused_workspace_dependencies = "allow"
unused_dependencies = "allow"
